<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Markdown Live Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=DM+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="studio-shell">
    <!-- Top Toolbar -->
    <header class="studio-header">
      <div class="brand">
        <div class="brand-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="16" y1="13" x2="8" y2="13"></line>
            <line x1="16" y1="17" x2="8" y2="17"></line>
            <polyline points="10 9 9 9 8 9"></polyline>
          </svg>
        </div>
        <div>
          <h1>Markdown Live Studio</h1>
          <p class="brand-sub">Live Markdown Editor &amp; Preview</p>
        </div>
      </div>

      <!-- Actions Bar -->
      <div class="header-actions">
        <button id="formatBold" class="tool-btn" title="Bold (Ctrl+B)"><strong>B</strong></button>
        <button id="formatItalic" class="tool-btn" title="Italic (Ctrl+I)"><em>I</em></button>
        <button id="formatHeading" class="tool-btn" title="Heading">H</button>
        <button id="formatQuote" class="tool-btn" title="Blockquote">&ldquo;</button>
        <button id="formatCode" class="tool-btn" title="Code Block">&lt;/&gt;</button>
        <button id="formatLink" class="tool-btn" title="Link">&#128279;</button>
        <button id="formatTable" class="tool-btn" title="Table">&#9638;</button>

        <div class="btn-divider"></div>

        <button id="copyHtmlBtn" class="btn btn-secondary">Copy HTML</button>
        <button id="exportMdBtn" class="btn btn-secondary">Download .md</button>
        <button id="exportHtmlBtn" class="btn btn-primary">Download .html</button>
      </div>
    </header>

    <!-- Studio Workspace (Split View) -->
    <main class="studio-workspace">
      <!-- Left Pane: Editor -->
      <section class="pane pane-editor">
        <div class="pane-header">
          <div class="pane-title">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
              <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
            </svg>
            Markdown Source
          </div>
          <button id="clearEditorBtn" class="btn-text" title="Clear Editor">Clear</button>
        </div>
        <textarea id="markdownEditor" spellcheck="false" placeholder="Write or paste markdown content here..."></textarea>
      </section>

      <!-- Right Pane: Rendered Preview -->
      <section class="pane pane-preview">
        <div class="pane-header">
          <div class="pane-title">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
            HTML Preview
          </div>
          <div class="sync-status">
            <span>Live</span>
          </div>
        </div>
        <div id="previewContainer" class="preview-content"></div>
      </section>
    </main>

    <!-- Bottom Telemetry Bar -->
    <footer class="telemetry-bar">
      <div class="telemetry-group">
        <span class="telemetry-item">Words: <strong id="wordCount">0</strong></span>
        <span class="telemetry-item">Characters: <strong id="charCount">0</strong></span>
        <span class="telemetry-item">Lines: <strong id="lineCount">0</strong></span>
        <span class="telemetry-item">Read Time: <strong id="readTime">~0 min</strong></span>
      </div>
      <div class="telemetry-save" id="autoSaveIndicator">
        Auto-saved to LocalStorage
      </div>
    </footer>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="toast"></div>

  <script src="app.js"></script>
</body>
</html>
